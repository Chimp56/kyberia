[package]
name = "kyberia-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kyberia"
path = "src/main.rs"

[dependencies]
kyberia-rendering-scene = { version = "=0.1.0", path = "../../crates/rendering-scene" }
kyberia-domain = { version = "=0.1.0", path = "../../crates/domain" }
kyberia-observation-analysis = { version = "=0.1.0", path = "../../crates/observation-analysis" }
kyberia-project-store = { version = "=0.1.0", path = "../../crates/project-store" }
kyberia-spatial-analysis = { version = "=0.1.0", path = "../../crates/spatial-analysis" }
kyberia-stored-analysis = { version = "=0.1.0", path = "../../crates/stored-analysis" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.21.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
signal-hook = "=0.4.4"

[target.'cfg(windows)'.dependencies]
kyberia-file-adapter = { version = "=0.1.0", path = "../../crates/file-adapter" }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
kyberia-causal-materializer = { version = "=0.1.0", path = "../../crates/causal-materializer" }
kyberia-operation-log = { version = "=0.1.0", path = "../../crates/operation-log" }
kyberia-survey = { version = "=0.1.0", path = "../../crates/survey" }

[lints]
workspace = true
