[package]
name = "kyberia-desktop"
version = "0.1.0"
description = "RF Atlas desktop shell"
authors = ["Kyberia contributors"]
edition = "2024"
license = "Apache-2.0 OR MIT"
build = "build.rs"

[lib]
name = "kyberia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.4.1"

[dependencies]
kyberia-application = { version = "=0.1.0", path = "../../../crates/application" }
kyberia-domain = { version = "=0.1.0", path = "../../../crates/domain" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.8.5", features = [] }
uuid = { version = "1.21.0", features = ["v4"] }

# This app is a separately checked Tauri package. Keeping a nested workspace
# means the foundation architecture checker only inventories reviewed core
# crates; the desktop shell still points at the canonical application crate.
[workspace]
