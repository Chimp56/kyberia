[package]
name = "kyberia-desktop"
version = "0.1.0"
description = "RF Atlas desktop shell"
authors = ["Kyberia contributors"]
edition = "2024"
license = "Apache-2.0 OR MIT"
build = "build.rs"

[lib]
name = "kyberia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
kyberia-application = { version = "=0.1.0", path = "../../../crates/application" }
kyberia-domain = { version = "=0.1.0", path = "../../../crates/domain" }
kyberia-resource-budget = { version = "=0.1.0", path = "../../../crates/resource-budget" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.8.5", features = [] }
uuid = { version = "1.21.0", features = ["v4"] }
