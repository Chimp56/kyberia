[package]
name = "kyberia-observation-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Validated measured RSSI selection and spatial-analysis composition"

[dependencies]
kyberia-domain = { version = "=0.1.0", path = "../domain" }
kyberia-spatial-analysis = { version = "=0.1.0", path = "../spatial-analysis" }
kyberia-survey = { version = "=0.1.0", path = "../survey" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[dev-dependencies]
proptest = "=1.10.0"

[lints.rust]
unsafe_code = "forbid"
