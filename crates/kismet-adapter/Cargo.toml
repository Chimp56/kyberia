[package]
name = "kyberia-kismet-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kyberia-domain = { version = "=0.1.0", path = "../domain" }
rusqlite = { version = "=0.40.2", features = ["bundled", "limits", "hooks"] }
sha2 = "=0.10.9"

tempfile = "=3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
serde_json = "=1.0.149"

[lints]
workspace = true
