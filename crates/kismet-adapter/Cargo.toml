[package]
name = "kyberia-kismet-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kyberia-domain = { version = "=0.1.0", path = "../domain" }
rusqlite = { version = "=0.40.2", features = ["bundled", "limits", "hooks"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
url = "=2.5.8"

tempfile = "=3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Security"] }

[lints]
workspace = true
