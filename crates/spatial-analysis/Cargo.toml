[package]
name = "kyberia-spatial-analysis"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Deterministic bounded numerical RSSI interpolation tiles"

[dependencies]
kyberia-domain = { version = "=0.1.0", path = "../domain" }
kyberia-wifi-semantics = { version = "=0.1.0", path = "../wifi-semantics" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[dev-dependencies]
proptest = "=1.10.0"

[lints.rust]
unsafe_code = "forbid"
