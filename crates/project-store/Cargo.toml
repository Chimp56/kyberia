[package]
name = "kyberia-project-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kyberia-causal-materializer = { version = "=0.1.0", path = "../causal-materializer" }
kyberia-domain = { version = "=0.1.0", path = "../domain" }
kyberia-materialization-identity = { version = "=0.1.0", path = "../materialization-identity" }
kyberia-operation-log = { version = "=0.1.0", path = "../operation-log" }
kyberia-resource-budget = { version = "=0.1.0", path = "../resource-budget" }
kyberia-survey = { version = "=0.1.0", path = "../survey" }
arrow-array = "=59.3.0"
arrow-schema = "=59.3.0"
bytes = "=1.12.1"
parquet = { version = "=59.3.0", default-features = false, features = ["arrow"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "limits", "hooks"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Security"] }

[lints]
workspace = true
