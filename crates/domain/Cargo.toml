[package]
name = "kyberia-domain"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Pure, validated canonical evidence contracts for Kyberia"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[dev-dependencies]
proptest = "=1.10.0"

[lints.rust]
unsafe_code = "forbid"
