[package]
name = "kyberia-application"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Canonical project lifecycle commands and immutable queries"

[dependencies]
kyberia-domain = { version = "=0.1.0", path = "../domain" }
kyberia-project-store = { version = "=0.1.0", path = "../project-store" }
kyberia-resource-budget = { version = "=0.1.0", path = "../resource-budget" }
kyberia-causal-materializer = { version = "=0.1.0", path = "../causal-materializer" }
kyberia-operation-log = { version = "=0.1.0", path = "../operation-log" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.21.0", features = ["v4"] }

[dev-dependencies]
serde_json = "=1.0.149"

[lints]
workspace = true
