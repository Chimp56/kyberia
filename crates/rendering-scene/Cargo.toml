[package]
name = "kyberia-rendering-scene"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Validated renderer-neutral projections of canonical spatial tiles"

[dependencies]
kyberia-domain = { path = "../domain" }
kyberia-spatial-analysis = { path = "../spatial-analysis" }
kyberia-wifi-semantics = { path = "../wifi-semantics" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
