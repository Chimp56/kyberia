[package]
name = "kyberia-wifi-semantics"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Pure deterministic Wi-Fi RF arithmetic and explicit signal aggregation"

[dependencies]
kyberia-domain = { version = "=0.1.0", path = "../domain" }
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
proptest = "=1.10.0"
serde_json = "=1.0.149"

[lints.rust]
unsafe_code = "forbid"
