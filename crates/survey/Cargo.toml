[package]
name = "kyberia-survey"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Deterministic point-survey evidence admission and completion"

[dependencies]
kyberia-domain = { version = "=0.1.0", path = "../domain" }
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.149"
proptest = "=1.10.0"

[lints.rust]
unsafe_code = "forbid"
