name: Foundation validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: false
      - name: Bootstrap locked toolchain and dependencies
        run: python tools/dev.py bootstrap
      - name: Compile foundation and CLI
        run: python tools/dev.py build
      - name: Check formatting, lint and dependency boundaries
        run: python tools/dev.py lint
      - name: Typecheck all workspace targets
        run: python tools/dev.py typecheck
      - name: Run Rust and Python regression suites
        run: python tools/dev.py test
      - name: Verify locked dependency source inventory
        run: python tools/dev.py source-check
      - name: Verify traceability and scientific fixtures
        run: python tools/dev.py evidence-check
