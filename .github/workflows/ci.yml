name: Foundation validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.12.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install pinned Lab MCP dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --dir tools/lab-mcp install --frozen-lockfile --store-dir tools/lab-mcp/.tools/pnpm-store
      - name: Bootstrap locked toolchain and dependencies
        run: python tools/dev.py bootstrap
      - name: Compile foundation and CLI
        run: python tools/dev.py build
      - name: Check formatting, lint and dependency boundaries
        run: python tools/dev.py lint
      - name: Typecheck all workspace targets
        run: python tools/dev.py typecheck
      - name: Run Rust and Python regression suites
        run: python tools/dev.py test
      - name: Validate Kyberia Lab MCP contracts
        run: python tools/dev.py lab-mcp-check
      - name: Verify locked dependency source inventory
        run: python tools/dev.py source-check
      - name: Verify traceability and scientific fixtures
        run: python tools/dev.py evidence-check
