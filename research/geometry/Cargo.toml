[package]
name = "kyberia-geometry-proof"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"
description = "Research-only geometry kernel comparison harness"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geo = { version = "0.33.1", default-features = false }
geojson = { version = "1.0.0", features = ["geo-types"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wkt = { version = "0.14.0", features = ["geo-types"] }
sha2 = "0.10.9"
